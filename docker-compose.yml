services:
  db:
    image: postgres:16-alpine
    container_name: miniledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger_user
      POSTGRES_PASSWORD: miniledger_password
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger_user -d miniledger"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  miniledger_data:
